name: Release Publish Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish assets to
        required: true
        type: string
      vyos_git_ref:
        description: Optional vyos-build git ref (tag/branch/commit). Empty uses default branch.
        required: false
        default: ""
      build_by:
        description: Value passed to --build-by
        required: false
        default: "quentin-roche"
      docker_image:
        description: VyOS build container image
        required: false
        default: "vyos/vyos-build:current"
      tmpfs_size:
        description: Container /work tmpfs size
        required: false
        default: "10g"

permissions:
  contents: write

jobs:
  release-publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VyOS image artifacts
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image || 'vyos/vyos-build:current' }}
          TMPFS_SIZE: ${{ inputs.tmpfs_size || '10g' }}
          BUILD_BY: ${{ inputs.build_by || 'quentin-roche' }}
          VYOS_GIT_REF: ${{ inputs.vyos_git_ref || '' }}
          OUT_DIR: ${{ github.workspace }}/images/vyos-router/artifacts
        run: ./images/vyos-router/build.sh

      - name: Load release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"

          release_name="$(echo "${release_json}" | jq -r '.name // .tag_name')"
          prerelease_flag="$(echo "${release_json}" | jq -r '.prerelease')"
          release_body="$(echo "${release_json}" | jq -r '.body // ""')"

          {
            echo "name=${release_name}"
            echo "tag=${TAG_NAME}"
            echo "prerelease=${prerelease_flag}"
            echo "body<<EOF"
            echo "${release_body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build upload file list
        id: release-files
        run: |
          set -euo pipefail

          artifacts_dir="images/vyos-router/artifacts"
          declare -A selected_by_name=()
          selected_paths=()

          while IFS= read -r -d '' file; do
            if [ ! -r "${file}" ]; then
              sudo chmod a+r "${file}" || true
            fi

            if [ ! -r "${file}" ]; then
              echo "::warning::Skipping unreadable artifact: ${file}"
              continue
            fi

            asset_name="$(basename "${file}")"
            if [ -n "${selected_by_name["${asset_name}"]+x}" ]; then
              echo "::warning::Skipping duplicate asset name '${asset_name}' from ${file}; already selected ${selected_by_name["${asset_name}"]}"
              continue
            fi

            selected_by_name["${asset_name}"]="${file}"
            selected_paths+=("${file}")
          done < <(
            find "${artifacts_dir}" -type f \
              \( -name "*.iso" -o -name "*.qcow2" -o -name "*.log" -o -name "SHA256SUMS" \) \
              -print0 | sort -z
          )

          if [ "${#selected_paths[@]}" -eq 0 ]; then
            echo "No uploadable release assets found in ${artifacts_dir}" >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${selected_paths[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          name: ${{ steps.release-meta.outputs.name }}
          body: ${{ steps.release-meta.outputs.body }}
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
          files: ${{ steps.release-files.outputs.files }}

name: Release Publish Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VyOS image artifacts
        env:
          OUT_DIR: ${{ github.workspace }}/os-image/artifacts
        run: ./os-image/build.sh

      - name: Load release metadata
        id: release-meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"

          release_name="$(echo "${release_json}" | jq -r '.name // .tag_name')"
          prerelease_flag="$(echo "${release_json}" | jq -r '.prerelease')"
          release_body="$(echo "${release_json}" | jq -r '.body // ""')"

          {
            echo "name=${release_name}"
            echo "tag=${TAG_NAME}"
            echo "prerelease=${prerelease_flag}"
            echo "body<<EOF"
            echo "${release_body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        id: release-files
        shell: bash
        env:
          TAG_NAME: ${{ steps.release-meta.outputs.tag }}
        run: |
          set -euo pipefail

          artifacts_dir="os-image/artifacts"
          release_assets_dir="${RUNNER_TEMP}/release-assets"
          release_version="$(printf '%s' "${TAG_NAME#v}" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p "${release_assets_dir}"

          qcow2_src="$(find "${artifacts_dir}" -type f -name 'vyos-*.qcow2' | sort | head -n 1)"

          if [ -z "${qcow2_src}" ]; then
            echo "Missing vyos QCOW2 artifact in ${artifacts_dir}" >&2
            exit 1
          fi

          qcow2_out="${release_assets_dir}/vyos-${release_version}-custom-flavor-amd64.qcow2"
          cp "${qcow2_src}" "${qcow2_out}"

          {
            echo "files<<EOF"
            echo "${qcow2_out}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          name: ${{ steps.release-meta.outputs.name }}
          body: ${{ steps.release-meta.outputs.body }}
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
          files: ${{ steps.release-files.outputs.files }}

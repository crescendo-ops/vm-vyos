name: Build VyOS Cloud-Init Image

on:
  workflow_dispatch:
    inputs:
      vyos_git_ref:
        description: "Optional vyos-build git ref (tag/branch/commit). Empty uses default branch."
        required: false
        default: ""
      build_by:
        description: "Value passed to --build-by"
        required: false
        default: "quentin-roche"
      docker_image:
        description: "VyOS build container image"
        required: false
        default: "vyos/vyos-build:current"
      tmpfs_size:
        description: "Container /work tmpfs size"
        required: false
        default: "10g"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cloud-init image
        env:
          DOCKER_IMAGE: ${{ github.event.inputs.docker_image || 'vyos/vyos-build:current' }}
          TMPFS_SIZE: ${{ github.event.inputs.tmpfs_size || '10g' }}
          BUILD_BY: ${{ github.event.inputs.build_by || 'quentin-roche' }}
          VYOS_GIT_REF: ${{ github.event.inputs.vyos_git_ref || '' }}
          OUT_DIR: ${{ github.workspace }}/out
        run: ./images/vyos-router/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyos-cloudinit-${{ github.sha }}
          path: out/**
          if-no-files-found: error
          retention-days: 14

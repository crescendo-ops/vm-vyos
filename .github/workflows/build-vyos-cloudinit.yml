name: Build VyOS Cloud-Init Image

on:
  workflow_dispatch:
    inputs:
      vyos_git_ref:
        description: "Optional vyos-build git ref (tag/branch/commit). Empty uses default branch."
        required: false
        default: ""
      build_by:
        description: "Value passed to --build-by"
        required: false
        default: "quentin-roche"
      docker_image:
        description: "VyOS build container image"
        required: false
        default: "vyos/vyos-build:current"
      tmpfs_size:
        description: "Container /work tmpfs size"
        required: false
        default: "10g"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cloud-init image
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          TMPFS_SIZE: ${{ inputs.tmpfs_size }}
          BUILD_BY: ${{ inputs.build_by }}
          VYOS_GIT_REF: ${{ inputs.vyos_git_ref }}
          OUT_DIR: ${{ github.workspace }}/out
        run: ./images/vyos-router/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyos-cloudinit-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 14

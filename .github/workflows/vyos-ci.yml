name: VyOS CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Validate build script syntax
        run: bash -n os-image/build.sh

      - name: Validate VyOS config format
        run: scripts/validate-vyos-config-format.sh

      - name: Validate Ansible playbook syntax
        run: ansible-playbook -i "localhost," --syntax-check ansible/redeploy-vyos-vm.yml
